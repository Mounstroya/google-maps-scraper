# Duran — el motor del Pipeline (buscador de prospectos) en el servidor del cliente.
#
# Este repo es un fork de un proyecto de terceros en Go (google-maps-scraper): NO es
# código nuestro, así que aquí no hay nada que ofuscar — Go ya compila a un binario y
# Nuitka solo aplica a Python. Lo único que hace este workflow es construir la imagen en
# Actions y publicarla en GHCR, para que el servidor del cliente solo haga pull y no
# necesite el fuente ni la cadena de compilación de Go.
#
#   git tag duran-v1.0.0 && git push origin duran-v1.0.0
#
# No lleva job de deploy: el compose de este servicio vive en el repo smartcrm
# (Duran/duran_reclutamiento_vps/), porque a quien le sirve es al Pipeline del CRM, y es
# ese workflow el que lo levanta.
name: Publicar Duran (motor de reclutamiento)

on:
  push:
    tags: ['duran-v*.*.*']
  workflow_dispatch:

concurrency:
  group: duran-reclutamiento
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#duran-v}"; else v="${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/duran-reclutamiento-scraper:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.lc }}/duran-reclutamiento-scraper:latest
